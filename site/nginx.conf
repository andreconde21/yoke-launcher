server {
    listen 80;
    root /usr/share/nginx/html;
    # /download serves download.html
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~* \.(css|js|svg|woff2)$ { expires 7d; }
    # The APK itself lives on GitHub Releases; this keeps a stable short link.
    location = /yoke.apk { return 302 https://github.com/andreconde21/yoke-launcher/releases/latest/download/yoke.apk; }
}
