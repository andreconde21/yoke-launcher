apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.outsmartis.yoke"
        minSdkVersion 26
        targetSdkVersion 36
        // CI passes these for releases (tag vX.Y.Z → versionName X.Y.Z, run number → versionCode).
        versionCode((System.getenv("YOKE_VERSION_CODE") ?: "1").toInteger())
        versionName(System.getenv("YOKE_VERSION_NAME") ?: "0.1.0")

        resourceConfigurations += ["en"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // Release signing only when CI provides the keystore; local release builds stay unsigned.
        if (System.getenv("YOKE_KEYSTORE")) {
            release {
                storeFile file(System.getenv("YOKE_KEYSTORE"))
                storePassword System.getenv("YOKE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("YOKE_KEY_ALIAS") ?: "yoke"
                keyPassword System.getenv("YOKE_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv("YOKE_KEYSTORE")) signingConfig signingConfigs.release
            debuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
    namespace 'com.outsmartis.yoke'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation libs.kotlin.stdlib
    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.recyclerview

    // Android lifecycle
    implementation libs.lifecycle.extensions
    implementation libs.lifecycle.viewmodel.ktx

    // Navigation
    implementation libs.navigation.fragment.ktx

    //Material dependency
    implementation libs.material

    testImplementation libs.junit
    testImplementation 'org.json:json:20250517'
}
